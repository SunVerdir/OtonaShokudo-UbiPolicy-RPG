[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# The repository has file-scoped MIT and CC BY 4.0 terms; see ATTRIBUTION.md.
# Avoid a single package-wide license expression that would misstate those scopes.
name = "otona-shokudo-ubi-policy-rpg"
version = "0.2.1"
description = "大人食堂（マルチモーダルUBI基盤）政策ゲーム案：遊びながら政策形成を学ぶ、人生ロープレの提案"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["policy", "game", "education", "japan", "society5.0", "UBI"]

[project.scripts]
otona-shokudo-rpg = "otona_shokudo_rpg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
otona_shokudo_rpg = ["data/*.json"]
